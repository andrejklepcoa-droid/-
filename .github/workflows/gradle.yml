name: Build Forge Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project files
        uses: actions/checkout@v3

      - name: Set up Java 8
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Grant execution permission for Gradle
        run: chmod +x ./gradlew

      - name: Build the mod
        run: ./gradlew build --stacktrace

      - name: Upload ready mod artifact
        uses: actions/upload-artifact@v3
        with:
          name: SimpleCoords-Build
          path: build/libs/*.jar

